# Fly.io app config for the WitnessWeave API. This backend must never go
# fully idle (bounty escrow, evaluation-sync, and reputation writes must
# always be reachable), so auto-stop is disabled and at least one machine is
# always kept running, backed by an HTTP health check that restarts a
# machine automatically if it stops responding.
app = "witnessweave-api"
primary_region = "iad"

[build]

[env]
  PORT = "8080"
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
