# Local development only. In production, Postgres runs as its own Fly.io
# app (a Fly Postgres cluster, created separately with `fly postgres create`
# per docs/deployment.md) — this compose file is not used in production.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: witnessweave
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: witnessweave
    ports:
      - "5432:5432"
    volumes:
      - witnessweave_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U witnessweave"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  witnessweave_pgdata:
